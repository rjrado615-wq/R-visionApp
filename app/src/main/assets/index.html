<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions</title>
<style>
:root{--bg:#faf8ff;--fg:#1c1b22;--card:#fff;--muted:#6b6878;--accent:#5b4bdb;--ok:#2e9e5b;--bad:#d9534f;--line:#e2dff0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141b;--fg:#f0eefa;--card:#201f29;--muted:#a09db0;--accent:#8f82ff;--line:#33313f}}
:root[data-theme="dark"]{--bg:#15141b;--fg:#f0eefa;--card:#201f29;--muted:#a09db0;--accent:#8f82ff;--line:#33313f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{margin:0;text-align:center;font-size:26px;font-weight:600}
.meta{text-align:center;color:var(--muted);font-size:14px}
.card{flex:1;min-height:260px;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:24px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06);user-select:none}
.card.back{border-color:var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px}
button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;cursor:pointer}
button.ok{background:var(--ok);color:#fff;border:0}
button.bad{background:var(--bad);color:#fff;border:0}
button.main{background:var(--accent);color:#fff;border:0}
button.sm{font-size:13px;padding:10px}
.hidden{display:none}
form,.panel{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;width:100%}

select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}</style>
</head>
<body>
<main>
  <h1>🌊 Révisions</h1>
  <select id="deck"></select>
  <div class="meta" id="meta"></div>
  <div class="card" id="card"></div>
  <div class="hint" id="hint"></div>
  <div class="row hidden" id="answers">
    <button class="bad" id="no">À revoir</button>
    <button class="ok" id="yes">Je savais</button>
  </div>
  <form id="addForm" class="hidden">
    <input id="q" placeholder="Question" autocomplete="off">
    <input id="a" placeholder="Réponse" autocomplete="off">
    <div class="row"><button type="button" id="cancel">Annuler</button><button class="main" type="submit">Ajouter</button></div>
  </form>
  <div class="row">
    <button id="add">+ Ajouter</button>
    <button id="del" class="sm">Supprimer</button>
  </div>
  <button id="reset" class="sm">Tout remettre à zéro (score et difficulté)</button>
</main>
<script>
const DECKS={"ocean": {"name": "Océanographie générale", "cards": [{"q": "Qu'est-ce que l'océanographie ?", "a": "Science qui étudie mers et océans : leurs limites et leurs interactions avec l'air, le fond, les continents et les organismes qui y vivent (pluridisciplinaire)"}, {"q": "Les 4 critères d'un océan ?", "a": "Vaste superficie ; profondeur moyenne importante ; large communication avec les autres océans ; rivages appartenant à des continents différents"}, {"q": "Différence entre mer et océan ?", "a": "Une mer ne possède pas les 4 critères à la fois"}, {"q": "Mers marginales : définition et exemples ?", "a": "Sur les bords des océans, large communication, faibles profondeurs. Ex : mer du Nord, Manche, mer Jaune, mer d'Oman"}, {"q": "Méditerranées (type de mer) : définition et exemples ?", "a": "Séparées de l'océan par un détroit formant un seuil, plus profondes. Ex : mer des Caraïbes, mer Rouge, Méditerranée"}, {"q": "Mers intérieures : définition et exemples ?", "a": "Dans les terres, débouchent sur une autre mer par un détroit peu profond. Ex : mer Noire (Bosphore), Baltique"}, {"q": "Mers fermées : exemples ?", "a": "Séparées complètement de l'océan : mer Caspienne, mer Morte, mer d'Aral"}, {"q": "Paramètres abiotiques du milieu marin ?", "a": "Température, pH, salinité, transparence, turbidité, oxygène dissous, éléments nutritifs"}, {"q": "Définition de la salinité ?", "a": "Masse (en g) de substances dissoutes dans 1 kg d'eau"}, {"q": "Comment mesure-t-on la transparence ?", "a": "Disque de Secchi (disque blanc de 30 cm) descendu jusqu'à sa disparition"}, {"q": "Que sont les MES ?", "a": "Matières en suspension : matériel particulaire (vivant ou détritique, minéral ou organique) entraîné passivement dans l'eau (mg/L)"}, {"q": "Les 2 grands domaines de classification des environnements ?", "a": "Domaine pélagique (pleine eau) et domaine benthique (fond)"}, {"q": "Zones du relief du fond marin ?", "a": "Plateau continental 0-200 m (néritique) ; talus 200-2000 m ; plaine abyssale 2000-6000 m (océanique) ; zone hadale > 6000 m"}, {"q": "Le système phytal : définition ?", "a": "4 étages (supra-, médio-/eu-, infra-, circalittoral), végétaux benthiques chlorophylliens, correspond au plateau continental"}, {"q": "Étage médiolittoral (eulittoral) ?", "a": "Zone de balancement des marées : alternance régulière d'émersion et d'immersion"}, {"q": "Étage infralittoral ?", "a": "Région assez éclairée pour la vie des zostéracées et des algues photophiles"}, {"q": "Étage circalittoral ?", "a": "S'étend jusqu'à la limite de vie des algues les moins exigeantes en lumière"}, {"q": "Les 3 étages du système aphytal ?", "a": "Bathyal (talus, 200-2000 m), abyssal (2000-6000 m), hadal (> 6000 m)"}, {"q": "Les 5 zones du domaine pélagique ?", "a": "Épipélagique (< 200 m) ; mésopélagique (200-1000 m) ; bathypélagique (1000-4000 m) ; abyssopélagique (4000 m-croûte) ; hadopélagique (failles, jusqu'à ~15 000 m)"}, {"q": "Les producteurs : rôle et exemples ?", "a": "Autotrophes, base de la chaîne : macroalgues, phanérogames (posidonies), phytoplancton. Production primaire = photosynthèse"}, {"q": "Consommateurs C1 et C2 ?", "a": "C1 : herbivores/phytophages (broutage), production secondaire. C2 : zoophages/carnivores (prédation), production tertiaire. Tous hétérotrophes"}, {"q": "Rôle des décomposeurs ?", "a": "Transforment la matière organique des morts en matière minérale réutilisable : dernier maillon, cycle de la matière bouclé"}, {"q": "Loi de Lindeman (1942) ?", "a": "Seulement ~10 % de l'énergie passe d'un maillon à l'autre (~90 % brûlés par les fonctions vitales)"}, {"q": "Réseau trophique ?", "a": "Chaînes alimentaires qui convergent en un réseau dense et complexe ; les derniers maillons sont moins nombreux que les premiers"}, {"q": "Niveaux de la pyramide trophique (0 à 5) ?", "a": "0 phytoplancton ; 1 zooplancton ; 2 prédateur I ; 3 prédateur II ; 4 prédateur III ; 5 super-prédateur"}, {"q": "Rôle des super-prédateurs ?", "a": "Régulent les proies, limitent les pullulations, rôle sanitaire (éliminent faibles et malades)"}, {"q": "Les énergies marines citées dans le cours ?", "a": "Biomasse algale, thermique, osmotique, marémotrice, éolienne, hydrolienne, houlomotrice"}, {"q": "Hydrolienne vs houlomotrice vs marémotrice ?", "a": "Hydrolienne : courants de marée. Houlomotrice : vagues. Marémotrice : différence de niveau entre marée haute et basse (barrages)"}, {"q": "Bathymétrie ?", "a": "Étude de la profondeur ; effets sur la lumière et la pression"}, {"q": "Pression : 1 bar et évolution avec la profondeur ?", "a": "1 bar = 1 kg/cm² ; +1 bar tous les 10 m"}, {"q": "Formule de la pression absolue ?", "a": "P absolue = P atmosphérique + P hydrostatique (2 bars à 10 m, 3 à 20 m, 4 à 30 m)"}, {"q": "Atténuation de la lumière : 2 phénomènes ?", "a": "Absorption et diffusion. Infrarouges absorbés dans le 1er mètre ; au-delà de 1000 m, nuit noire"}, {"q": "Zone euphotique et profondeur de compensation ?", "a": "Euphotique : photosynthèse à rendement positif (jusqu'à ~200 m). Compensation : respiration = photosynthèse"}, {"q": "Zone oligophotique ?", "a": "Un peu de lumière mais trop faible pour une photosynthèse pérenne (200-500 m en Méditerranée)"}, {"q": "Photophiles vs sciaphiles ?", "a": "Photophiles : aiment la lumière (algues, cnidaires à zooxanthelles). Sciaphiles : zones peu éclairées (corail rouge, Leptopsammia)"}, {"q": "Température en profondeur ?", "a": "Homogène au-delà de 1000 m, ~4 °C (min ~2 °C vers 4000 m) ; 12 °C en Méditerranée (seuil de Gibraltar)"}, {"q": "Eurythermes, sténothermes, thermophiles ?", "a": "Eurythermes : supportent de fortes variations. Sténothermes : très peu. Thermophiles : aiment les hautes températures"}, {"q": "Thermocline ?", "a": "Brusque décroissance de température : 25-75 m en mers tropicales, 100-1000 m en mers tempérées"}, {"q": "Variations de la salinité en surface ?", "a": "90 % entre 34 et 35 ‰ ; ~34 ‰ près de l'équateur (pluies), 36-37 ‰ sous les tropiques (évaporation)"}, {"q": "Solubilité de l'oxygène dans l'eau ?", "a": "Diminue quand la salinité et la température augmentent (à 20 °C : 9 mg/L eau douce, 7,4 mg/L eau salée)"}, {"q": "Densité de l'eau de mer ?", "a": "1,025 à 1,041 ; plus elle est salée et froide, plus elle est dense et plonge"}, {"q": "pH : définition et valeur en mer ?", "a": "-log de l'activité des ions H⁺ ; 7 neutre ; eau de mer 7,5 à 8,5 (~8,2), stable grâce au pouvoir tampon (carbonates, borates)"}, {"q": "Province néritique vs océanique ?", "a": "Néritique : plateau continental jusqu'à -200 m, peuplements riches. Océanique : au large, eaux assez pauvres"}, {"q": "Plancton, necton, neuston ?", "a": "Plancton : entraîné passivement. Necton : nage indépendamment des courants. Neuston : flotte à la surface"}, {"q": "Benthos : sessile, sédentaire, vagile, fouisseur ?", "a": "Sessile : fixé. Sédentaire : bouge peu. Vagile : se déplace. Fouisseur : enfoui dans le sédiment"}, {"q": "Holoplancton vs méroplancton ?", "a": "Holoplancton : tout le cycle de vie dans le plancton. Méroplancton : une partie seulement (œufs, larves)"}, {"q": "Adaptations du plancton à la flottaison ?", "a": "Plus de surface portante (soies, épines), petite taille, flotteurs de gaz, gouttelettes lipidiques, corps transparent"}, {"q": "Adaptations du necton ?", "a": "Formes hydrodynamiques (fusiformes) ; dos sombre et ventre clair (homochromie)"}, {"q": "Poisson anadrome vs catadrome ?", "a": "Anadrome : vit en mer, se reproduit en eau douce. Catadrome : vit en eau douce, se reproduit en mer"}, {"q": "Poisson diadrome, océanodrome, potamodrome ?", "a": "Diadrome : alterne eau de mer et eau douce. Océanodrome : reste en mer. Potamodrome : reste en eau douce"}, {"q": "Classification dimensionnelle du benthos ?", "a": "Microbenthos < 0,1 mm ; méiobenthos 0,1-2 mm ; macrobenthos > 2 mm"}, {"q": "Régimes trophiques du macrobenthos (5) ?", "a": "Suspensivores, déposivores de surface, déposivores de sub-surface (limivores), brouteurs, carnivores macrophages (nécrophages)"}, {"q": "Cycle bentho-pélagique vs holobenthique ?", "a": "Bentho-pélagique : phase larvaire planctonique puis adulte benthique (70 % des espèces). Holobenthique : pas de phase larvaire"}, {"q": "Abysses : définition ?", "a": "Étendues d'eau de plus de 1000 m ; environ la moitié de la superficie des océans"}, {"q": "Adaptation des poissons abyssaux à la pression ?", "a": "Perte de la vessie natatoire au profit d'organes liquides et gélatineux incompressibles (ne peuvent plus remonter)"}, {"q": "Réaction de la bioluminescence ?", "a": "Luciférine + ATP + O₂ --(luciférase)--> oxyluciférine + photon + ADP"}, {"q": "Les 4 rôles de la bioluminescence ?", "a": "Éclairage, attraction des proies, protection contre les prédateurs, communication"}, {"q": "Sources hydrothermales : caractéristiques ?", "a": "Découvertes en 1977-78 (ride Est-Pacifique) ; fumeurs noirs jusqu'à 400 °C ; fluide acide, sans oxygène, riche en sulfures"}, {"q": "Base de la chaîne alimentaire hydrothermale ?", "a": "Bactéries chimio-autotrophes (chimiolithotrophie, oxydation du H₂S, etc.)"}, {"q": "Les 3 apports de nourriture dans les abysses ?", "a": "Pluie de particules (neige marine) ; déjections et carcasses ; « chaîne de poissons » mangeant ceux de l'étage supérieur"}, {"q": "Solutions à la solitude sexuelle dans les abysses ?", "a": "Regroupement, hermaphrodisme (autofécondation), stockage du sperme (calamars : mâles 10 fois plus petits)"}, {"q": "Les 3 mouvements de l'eau (chapitre IV) ?", "a": "Vagues (vent), courants (chaleur, rotation de la Terre, pesanteur), marées (Lune et Soleil)"}, {"q": "Cause des courants de surface ?", "a": "Vents et force de Coriolis : sens horaire (hém. nord), anti-horaire (hém. sud). Couche d'Ekman : à droite du vent au nord"}, {"q": "Upwelling ?", "a": "Le vent chasse l'eau chaude de surface au large, remplacée par de l'eau froide profonde riche en oxygène : zones poissonneuses"}, {"q": "Downwelling ?", "a": "Convergence de courants de surface : les eaux s'enfoncent selon leur densité et apportent l'oxygène en profondeur"}, {"q": "Circulation thermohaline (tapis roulant) ?", "a": "Due aux différences de température et de salinité ; plongée en Atlantique Nord ; environ 1000 ans pour un aller-retour"}, {"q": "El Niño : conséquences ?", "a": "Alizés affaiblis ou renversés : réchauffement des eaux Pérou-Équateur, perte de l'upwelling (pêcheries), sécheresse Indonésie-Australie"}, {"q": "Situation normale du Pacifique (sans El Niño) ?", "a": "Alizés vers l'ouest, empilement d'eau côté Australie-Indonésie (+50 cm), thermocline en pente, upwelling Pérou-Équateur"}, {"q": "Qu'est-ce qu'une vague et sa cause principale ?", "a": "Onde mécanique à l'interface eau/air (crête, creux). Cause principale : le vent"}, {"q": "Tsunami : sens du mot et causes ?", "a": "« Vague dans le port » (japonais). Déplacement brutal d'eau : séisme sous-marin (magnitude ≥ 7), éruption, glissement de terrain, météorite"}, {"q": "Tsunami près des côtes ?", "a": "Période constante ; vitesse et longueur d'onde diminuent ; l'amplitude augmente (~40 km/h à 10 m de profondeur)"}, {"q": "Définition de la marée ?", "a": "Mouvement régulier et périodique des eaux : montée (flux, flot) et descente (reflux, jusant), causé par la gravitation de la Lune et du Soleil"}, {"q": "Origine des deux renflements des marées ?", "a": "Attraction gravitationnelle (côté de la Lune) + force centrifuge (côté opposé) : toujours deux renflements"}, {"q": "Marée semi-diurne ?", "a": "2 pleines mers et 2 basses mers par jour ; 12 h 25 entre deux pleines mers ; décalage de ~50 min par jour"}, {"q": "Qu'est-ce que le marnage ?", "a": "Différence de hauteur entre une pleine mer et la basse mer consécutive"}, {"q": "Vives-eaux vs mortes-eaux ?", "a": "Vives-eaux : syzygies (nouvelle et pleine Lune), forces additionnées, grand marnage. Mortes-eaux : quadratures (quartiers), forces contrariées, faible marnage"}, {"q": "Marées d'équinoxe ?", "a": "2 par an (mars et septembre) : plus fortes vives-eaux ; déclinaison du Soleil nulle aux équinoxes"}, {"q": "Revif et déchet ?", "a": "Revif : marnage croissant (7-8 j) jusqu'aux vives-eaux. Déchet : marnage décroissant jusqu'aux mortes-eaux"}, {"q": "Les 4 types de marées ?", "a": "Semi-diurne ; diurne ; semi-diurne à inégalité diurne ; mixte"}, {"q": "Règle des douzièmes ?", "a": "Par heure de marée : 1/12, 2/12, 3/12, 3/12, 2/12, 1/12 du marnage (6 heures-marée)"}, {"q": "Durée du mois lunaire ?", "a": "29 j 12 h 44 min (temps entre deux phases identiques de la Lune)"}]}, "bio": {"name": "Biodiversité marine et côtière", "cards": [{"q": "Part de la surface terrestre couverte par les océans ?", "a": "≈ 71 % (hémisphère nord : 61 % de mer ; hémisphère sud : 81 %)"}, {"q": "Les 5 océans du monde ?", "a": "Pacifique, Atlantique, Indien, Arctique, Austral (glacial Antarctique)"}, {"q": "Océan Pacifique : chiffres clés ?", "a": "166 millions km² (46 % des océans) ; profondeur moy. 4 280 m ; fosse des Mariannes ~11 000 m ; « ceinture de feu » : > 80 % des volcans actifs"}, {"q": "Océan Atlantique : chiffres clés ?", "a": "82 millions km² (2e, 24 %) ; moy. 3 600 m ; max 8 605 m (fosse de Porto Rico) ; activité géologique le long de la dorsale médio-atlantique"}, {"q": "Océan Indien : chiffres clés ?", "a": "73 millions km² (3e, 20 %) ; moy. 3 890 m ; max 7 125 m (fosse de Java) ; grandes îles : Madagascar et Sri Lanka"}, {"q": "Océan Arctique ?", "a": "« Mer » de l'Atlantique : 80 % des échanges par le canal Groenland-Norvège, < 20 % vers le Pacifique par le détroit de Béring ; surtout plate-forme continentale"}, {"q": "Océan Austral ?", "a": "Zones méridionales de l'Atlantique, Indien et Pacifique ; borde l'Antarctique ; limite nord vers 55° S ; eaux extrêmement riches"}, {"q": "Origine du mot « écologie » ?", "a": "Créé en 1866 par Ernst Haeckel : oikos (maison, habitat) + logos (science)"}, {"q": "Les 3 niveaux d'étude de l'écologie ?", "a": "Individu, population, communauté (biocénose)"}, {"q": "Autoécologie, dynamique des populations, synécologie ?", "a": "Autoécologie : une espèce et son milieu. Dynamique des populations : variations d'abondance. Synécologie : rapports entre espèces d'un même groupement et avec le milieu"}, {"q": "Écosystème : définition et auteur ?", "a": "Défini par Tansley (1935) : système formé de deux éléments indissociables, la biocénose et le biotope"}, {"q": "Biocénose vs biotope ?", "a": "Biocénose : ensemble des organismes qui vivent ensemble. Biotope (écotope) : milieu abiotique (substrat, climat…) qui l'accueille"}, {"q": "Niche écologique vs habitat ?", "a": "Niche : position de l'organisme (conditions, ressources, temps). Habitat : environnement physique où il vit (contient beaucoup de niches). Ex : le crapaud change de niche (aquatique puis terrestre)"}, {"q": "Facteurs abiotiques vs biotiques ?", "a": "Abiotiques : caractéristiques physico-chimiques (climat, sol). Biotiques : interactions entre êtres vivants (prédation, parasitisme, compétition, symbiose, commensalisme)"}, {"q": "Définition de la biodiversité (ONU, 1992) ?", "a": "Variabilité des organismes vivants de toute origine : diversité au sein des espèces, entre espèces et celle des écosystèmes"}, {"q": "Les 3 niveaux de biodiversité ?", "a": "Génétique (intraspécifique), spécifique (entre espèces), écosystémique"}, {"q": "2 dimensions pour mesurer la biodiversité ?", "a": "L'abondance et l'équitabilité (répartition des individus entre espèces) ; on utilise aussi des espèces bio-indicatrices"}, {"q": "Combien d'espèces connues et estimées ?", "a": "~1,7 million décrites (350 000 végétales, 1,3 M animales dont 950 000 insectes) ; estimées entre 10 et 30 millions ; 16 000-18 000 nouvelles par an"}, {"q": "Pourquoi la biodiversité est-elle importante ?", "a": "Alimentation, santé, industrie, intérêt scientifique, tourisme, équilibre de la planète"}, {"q": "Biodiversité et santé : chiffres ?", "a": "> 40 % des molécules pharmaceutiques ont une origine biologique : 61 % plantes, 32 % micro-organismes, 7 % animaux"}, {"q": "Espèce clé de voûte ?", "a": "Occupe une place dans l'équilibre de l'écosystème qu'aucune autre ne peut tenir ; sa disparition = une maille coupée dans un pull-over"}, {"q": "Les 4 catégories de services écosystémiques ?", "a": "Approvisionnement, régulation, culturels, soutien"}, {"q": "Exemples de services écosystémiques ?", "a": "Approvisionnement : aliments, eau, médicaments. Régulation : climat, érosion, épuration. Soutien : production primaire, recyclage des nutriments. Culturels : loisirs, spiritualité"}, {"q": "Les valeurs de la biodiversité ?", "a": "Éthique (devoir moral, équité entre générations), sociale (UICN : lutte contre la pauvreté), économique (> 26 000 milliards €/an)"}, {"q": "Rythme d'extinction des espèces ?", "a": "Naturel : ~10 espèces/an ; actuel : 100 à 1000 fois plus ; jusqu'à 10 000/an possible dans quelques décennies"}, {"q": "Les 5 grandes causes d'érosion de la biodiversité ?", "a": "Destruction des habitats (1re cause), invasions biologiques, pollution, surexploitation, changements climatiques"}, {"q": "Destruction des habitats : chiffres ?", "a": "45 % des forêts disparues ; 200 M ha perdus depuis 1990 ; ~10 M ha/an ; la forêt tropicale abrite 75 % de la biodiversité terrestre ; la fragmentation isole les populations"}, {"q": "Invasions biologiques : exemple du cours ?", "a": "Le capitaine (poisson prédateur) introduit dans le lac Victoria (années 1960) : disparition d'environ 200 espèces de cichlidés endémiques"}, {"q": "Surexploitation : deux cas extrêmes ?", "a": "Exploitation indirecte (prises accessoires, ex. tortues tuées par la palangre) et exploitation commerciale intensive (morue du Canada, thon rouge de Méditerranée)"}, {"q": "Changements climatiques : 3 réactions possibles des espèces ?", "a": "Migration, adaptation rapide, disparition (15 à 37 % des espèces en 50 ans) ; + acidification des océans (coraux)"}, {"q": "Biodiversité marine vs terrestre (phylums) ?", "a": "Milieu marin : 28 phylums dont 13 exclusivement marins. Milieu terrestre : 11 phylums dont 1 exclusif"}, {"q": "Combien d'espèces marines ?", "a": "~300 000 reconnues ; plus de 2 millions estimées"}, {"q": "Mont sous-marin, monticule, aiguille ?", "a": "Mont sous-marin : élévation isolée de 1000 m ou plus depuis la plaine abyssale, sommet peu large. Aiguille : petite élévation en forme de colonne"}, {"q": "Zones océaniques (cours de biodiversité) ?", "a": "Eaux de surface 0-200 m ; profondeur moyenne 200-1000 m ; bathypélagique 1000-4000 m ; plaine abyssale 4000-5000 m"}, {"q": "Systèmes de la zone côtière ?", "a": "Récifs coralliens, mangroves, herbiers à phanérogames"}, {"q": "Population et côtes ?", "a": "~67 % de la population vit à moins de 60 km de la côte ; 5,5 milliards (1992) → 8,5 milliards (2023)"}, {"q": "Menaces sur la biodiversité marine et côtière ?", "a": "Dégradation des habitats, changement climatique, surexploitation/pêche, pollutions, introduction d'espèces, tourisme"}, {"q": "Dégradation des habitats marins : chiffres ?", "a": "Première menace. Récifs : ~60 % dégradés (sédimentation, dynamite, déchets). Mangroves : ~45 % dégradées en Indonésie"}, {"q": "Changement climatique en mer ?", "a": "Hausse de 1,8 à 2 °C d'ici 2050 ; blanchissement : 20 % des récifs détruits ; élévation du niveau de la mer (Maldives, Tuvalu, Bangladesh)"}, {"q": "Effets de la surpêche ?", "a": "Changement de la distribution de taille, perte de diversité génétique, espèces de faible valeur marchande ; effets sur oiseaux et mammifères marins"}, {"q": "Pollutions marines ?", "a": "Métaux lourds (local, zones minières), excès de matière organique, hydrocarbures (effets locaux), déchets (~75 % plastiques) : tortues vertes (Chelonia mydas) vulnérables"}, {"q": "Tourisme : effets sur le littoral ?", "a": "Stress des écosystèmes côtiers ; destruction d'habitats (mangroves) ; zones humides utilisées sans évaluer les bénéfices d'un écosystème intact"}, {"q": "Faune marine de Madagascar ?", "a": "> 10 000 espèces animales marines d'eau peu profonde dans l'Ouest de l'océan Indien, > 2000 poissons, > 300 coraux ; 3 écosystèmes : récifs, mangroves, herbiers"}, {"q": "Récifs coralliens de Madagascar ?", "a": "Frangeants, barrières, bancs récifaux, bancs submergés, hauts fonds ; ~3450 km au total ; mieux développés sur la côte Est ; récifs algaux (gris) dans l'extrême sud (Lavanono)"}, {"q": "Herbiers à phanérogames : rôles ?", "a": "Plantes à fleurs marines (jusqu'à 40 m) : stabilisent les sédiments, abri pour poissons et invertébrés, cycle des nutriments, nourriture du dugong et de la tortue verte ; 12 espèces à Madagascar, jamais cartographiés"}, {"q": "Mangroves : définition et adaptation ?", "a": "Communautés d'arbres des estrans tropicaux, tolérant sel et sols anoxiques ; racines aériennes (pneumatophores)"}, {"q": "Rôles des mangroves ?", "a": "Habitat et nurserie, piège à sédiments, pêcheries de crevettes et aquaculture, bois, protection du littoral, racines colonisées par des invertébrés"}, {"q": "Mangroves de Madagascar : diversité ?", "a": "8 espèces au total ; la plupart des forêts regroupent 6 espèces de 4 familles"}, {"q": "Zones humides littorales de Madagascar ?", "a": "~2 millions d'ha ; > 90 % sur la côte ouest (nombreux fleuves) ; les plus vastes sont associées aux deltas (Mahajamba-Mangoky)"}, {"q": "Baies de Madagascar ?", "a": "La plupart sur la côte ouest ; la plus grande : baie d'Antongil (nord-est) ; habitat de crevettes, oiseaux aquatiques, baleine à bosse"}, {"q": "Forêts littorales ?", "a": "Au-dessus de la marée haute (excluent les mangroves) : feuilles persistantes (Est, Sambirano), caduques (ouest), fourrés secs (extrême sud) ; parmi les écosystèmes les plus menacés"}, {"q": "Conservation : définition ?", "a": "Ensemble de pratiques (protection, restauration, utilisation durable) pour préserver la biodiversité et les services écologiques pour les générations actuelles et futures"}, {"q": "Protection vs protection intégrale ?", "a": "Protection : moyens pour maintenir l'état naturel et réduire les menaces (clôtures, statuts d'aires protégées, patrouilles, sensibilisation). Intégrale : maintenir intact en évitant toute activité humaine"}, {"q": "Restauration écologique ?", "a": "Actions visant à rétablir un caractère plus naturel à un écosystème dégradé (composition, structure, dynamique, fonctions). Ex : restaurer des milieux humides drainés"}, {"q": "Utilisation, aménagement et mise en valeur durables ?", "a": "Utilisation durable : usage sans préjudice significatif à la biodiversité. Aménagement durable : interventions pour maintenir ou augmenter la productivité des ressources. Mise en valeur durable : favoriser l'utilisation durable d'un écosystème"}]}, "flore": {"name": "Flore et faune marines", "cards": [{"q": "Thallophytes vs cormophytes ?", "a": "Thallophytes : pas de tissus ni d'organes différenciés (appareil végétatif = thalle). Cormophytes : cormus (axes feuillés, vrais tissus et organes)"}, {"q": "Définition des algues ?", "a": "Êtres uni- ou pluricellulaires, autotrophes, avec chlorophylle a + autres pigments ; cryptogames, thallophytes ; la reproduction nécessite l'eau"}, {"q": "Archéthalle : formes ?", "a": "Toutes les cellules ont le même rôle : unicellulaire (monadoïde Chlamydomonas, coccoïde Chlorella), colonial/cénobe (Volvox), filamenteux (Spirogyra, Ulothrix)"}, {"q": "Nématothalle ?", "a": "Thalle avec zone de croissance : tubulaire (Enteromorpha, une couche de cellules) ou foliacé (Ulva, deux couches)"}, {"q": "Cladomothalle ?", "a": "Thalle avec axe préférentiel de croissance (cladome) et ramifications latérales (pleuridies) : thalle à cladome (Chara) ou thalle fucoïde"}, {"q": "Thalle fucoïde : 3 parties ?", "a": "Fronde (lame, aplatie), stipe (fausse tige), crampons (haptères) qui fixent l'algue"}, {"q": "3 types d'algues selon l'habitat ?", "a": "Pélagiques (diatomées), symbiotiques (zooxanthelles), benthiques (fixées au substrat)"}, {"q": "Algues benthiques : 3 familles et chlorophylles ?", "a": "Vertes (chl. a + b), brunes (a + c), rouges (a + d). Le type de chlorophylle détermine la profondeur de vie"}, {"q": "Reproduction asexuée des algues ?", "a": "Division mitotique (scissiparité), fragmentation du thalle, spores (sporulation), propagules"}, {"q": "Types de fécondation chez les algues ?", "a": "Isogamie, anisogamie, oogamie, cystogamie (pont de conjugaison), trichogamie (trichogyne), aplanogamie"}, {"q": "Haplophase et diplophase ?", "a": "Haplophase (n) : de la méiose à la fécondation. Diplophase (2n) : de la fécondation à la méiose"}, {"q": "Gamétophyte vs sporophyte ?", "a": "Gamétophyte : produit les gamètes. Sporophyte (2n) : produit les spores (n) après méiose"}, {"q": "Algues brunes : caractéristiques ?", "a": "Chromophycophytes, classe des phéophycées (~1500 espèces) ; chl. a et c + fucoxanthine ; mers froides et tempérées ; vésicules d'air ; toujours pluricellulaires"}, {"q": "Phéophycées : 2 sous-classes ?", "a": "Phéosporophycidées (zoïdocystes, cycle digénétique) et Cyclosporophycidées (oogamie, conceptacles dans les réceptacles, cycle monogénétique)"}, {"q": "Fucales vs Laminariales ?", "a": "Fucales (Cyclosporophycidées, un seul ordre) : Fucus, Pelvetia, Ascophyllum, Sargassum. Laminariales (Phéosporophycidées) : Phyllaria, Laminaria, Macrocystis"}, {"q": "Fucus vesiculosus : description ?", "a": "Zone de balancement des marées, fixé aux rochers ; fronde dichotome de 20 à 100 cm ; vésicules aérifères (flotteurs) ; côte médiane ; brun-olive"}, {"q": "Étagement des Fucus (Bretagne) ?", "a": "Du haut vers le bas de l'estran : Fucus spiralis, F. vesiculosus, puis F. serratus"}, {"q": "Fucus vesiculosus : reproduction et cycle ?", "a": "Dioïque, oogamie, conceptacles dans les réceptacles ; cycle monogénétique diplophasique (une seule génération : le sporophyte 2n)"}, {"q": "Laminaria digitata ?", "a": "Stipe cylindrique + lame palmée en lanières ; 3-4 m ; pérenne (4-5 ans) ; Atlantique Nord ; exploitée pour potassium, iode et alginates"}, {"q": "Cycle des laminaires ?", "a": "Digénétique haplodiplophasique, dithétéromorphe : grand sporophyte (2n) et gamétophyte minuscule filamenteux (n) ; oogamie ; sores avec sporocystes et zoïdospores"}, {"q": "Algues rouges : généralités ?", "a": "Rhodophytes : ~5000 espèces, surtout marines ; chl. a et d ; vivent à grande profondeur ; plus ancien fossile eucaryote pluricellulaire (1,7 milliard d'années)"}, {"q": "Particularités des algues rouges ?", "a": "Phycobiliprotéines (phycoérythrine = rouge) dans des phycobilisomes ; chloroplaste = rhodoplaste ; amidon floridéen ; paroi de polymères de galactose ; pas de flagelles"}, {"q": "Utilisations des algues rouges ?", "a": "Chondrus crispus et Gigartina stellata : carraghénanes (gélifiants, agar-agar). Porphyra : nori (sushis), cultivée au Japon"}, {"q": "Rhodophytes : fécondation et cycle ?", "a": "Trichogamie (le trichogyne capte la spermatie sans flagelle jusqu'au carpogone) ; cycle trigénétique : gamétophyte (n), carposporophyte (2n), tétrasporophyte (2n)"}, {"q": "Sous-classes des rhodophycées ?", "a": "Bangiophycidées (structure simple, 3 ordres) et Florideophycidées (complexes, 14 ordres, synapses, cladome)"}, {"q": "Antithamnion (algue rouge) ?", "a": "Cladome uniaxial rouge, marin et profond ; dioïque ; cycle trigénétique haplodiplophasique isomorphe ; tétraspores"}, {"q": "Algues vertes : généralités ?", "a": "6000-7000 espèces (plus grand groupe), surtout d'eau douce ; chl. a et b ; paroi cellulosique ; réserve d'amidon (pyrénoïdes) ; origine des plantes supérieures"}, {"q": "Algues vertes et pollution ?", "a": "Sensibles à la pollution organique et aux nitrates : prolifération = marées vertes (Ulva) ; bio-indicateurs de pollution"}, {"q": "Les 4 classes de Chlorophycophytes ?", "a": "Chlorophyceae, Zygophyceae, Charophyceae, Prasinophyceae"}, {"q": "Chara ?", "a": "Charophycée d'eaux douces carbonatées ; thalle cladomien (axe + verticilles, entre-nœuds = une cellule géante) ; oogamie, monoïque ; cycle monogénétique haplophasique ; oospore"}, {"q": "Spirogyra ?", "a": "Zygophycée : filaments non ramifiés, chloroplaste en ruban spiralé ; cystogamie (pont de conjugaison), zygospore ; cycle haplophasique ; bio-indicateur de pollution"}, {"q": "Ulva lactuca ?", "a": "Laitue de mer : chlorophycée à thalle foliacé de 2 couches (5-50 cm) ; tolérante à la pollution ; anisogamie (planogamie) ; cycle digénétique haplodiplophasique isomorphe"}, {"q": "Chlamydomonas, Volvox, Chlorella ?", "a": "Chlamydomonas : unicellulaire flagellée (isogamie). Volvox : colonie cénobienne mobile. Chlorella : coccoïde, complément alimentaire"}, {"q": "Mangrove : définition ?", "a": "Communauté de plantes ligneuses (palétuviers) des côtes protégées tropicales et subtropicales ; rencontre entre faune aquatique et terrestre"}, {"q": "Les 4 fonctions des mangroves ?", "a": "Hydrologiques (stockage, auto-épuration, filtre), biologiques (réservoir de biodiversité, reproduction), salvatrices (protection côtière, ceinture verte), économiques (« supermarché du pauvre »)"}, {"q": "Mangrove malgache : diversité ?", "a": "8 espèces de palétuviers de 6 familles (domaine indopacifique occidental) : relativement pauvre"}, {"q": "Palétuviers de Madagascar ?", "a": "Avicennia marina, Lumnitzera racemosa, Sonneratia alba, Xylocarpus granatum, Rhizophora mucronata, Bruguiera gymnorrhiza, Ceriops tagal, Heritiera littoralis"}, {"q": "Les 4 types de racines des palétuviers ?", "a": "Pneumatophores (Avicennia, Sonneratia) ; coudées/genouillées (Bruguiera, Lumnitzera) ; à contreforts (Xylocarpus, Ceriops) ; échasses (Rhizophora)"}, {"q": "Viviparité chez les palétuviers ?", "a": "La graine germe sur l'arbre-mère (Rhizophoraceae) ; la propagule se détache, se plante dans la vase ou flotte jusqu'à 6 mois"}, {"q": "Faune des mangroves ?", "a": "80 % des espèces marines tropicales y passent un moment ; nurserie ; mollusques (Crassostrea, Terebralia), crustacés (Penaeus, Uca, Scylla serrata), oiseaux"}, {"q": "Le périophthalme ?", "a": "Téléostéen (Periophthalmus) qui sort de l'eau : branchies + poumon rudimentaire, nageoires utilisées comme des pattes"}, {"q": "Spongiaires : généralités ?", "a": "Embranchement très primitif (~700 Ma, Précambrien), diploblastiques, sans symétrie, corps couvert de pores (porifères) ; sessiles et filtreurs ; ~5000 espèces"}, {"q": "Circulation de l'eau chez une éponge ?", "a": "Entrée par les pores inhalants, sortie par l'oscule (orifice exhalant, fait fonction d'anus) ; 10-30 s pour filtrer son propre volume"}, {"q": "Choanocytes ?", "a": "Cellules à flagelle et collerette de l'endoderme : créent le courant d'eau et capturent la nourriture"}, {"q": "Squelette des éponges ?", "a": "Spicules (calcaire ou silice) et/ou spongine (fibres de protéine) ; fabriqués par les scléroblastes ; Spongia officinalis n'a pas de spicules"}, {"q": "Types d'organisation des éponges ?", "a": "Ascon (sac, le plus simple), sycon, leucon (le plus complexe) ; mésoglée entre pinacoderme et choanoderme"}, {"q": "Reproduction des éponges ?", "a": "Asexuée : régénération, bourgeonnement externe, bourgeonnement interne (gemmules). Sexuée : gonochoriques ou hermaphrodites, vivipares, larve nageant quelques heures"}, {"q": "Les 3 classes de spongiaires ?", "a": "Éponges calcaires, hexactinellides, démosponges"}, {"q": "Cnidaires : généralités ?", "a": "Diploblastiques, symétrie radiaire, un seul orifice entouré de tentacules ; 99 % marins ; polype (fixé) et méduse (nageuse) ; mésoglée très développée chez les méduses"}, {"q": "Cnidoblaste et cnidocyste ?", "a": "Cellule urticante : capsule (cnidocyste) contenant un filament-harpon et du venin ; déclenchée par le cnidocil ; ne fonctionne qu'une fois"}, {"q": "Les 3 classes de cnidaires ?", "a": "Hydrozoaires, Scyphozoaires, Anthozoaires"}, {"q": "Hydrozoaires ?", "a": "Seule classe avec espèces d'eau douce ; alternance polype-méduse ; méduses craspédotes (vélum) ; ordres : hydraires, siphonophores (physalie), hydrocoralliaires (millepores)"}, {"q": "Scyphozoaires ?", "a": "Phase méduse dominante, acraspédotes (sans vélum) ; cycle d'Aurelia : planula, scyphostome, strobilisation, éphyra ; rhopalies (ocelles, statocyste)"}, {"q": "Anthozoaires ?", "a": "Uniquement des polypes (pas de méduse), solitaires ou coloniaux ; pharynx avec siphonoglyphe ; Octocoralliaires et Hexacoralliaires"}, {"q": "Octocoralliaires ?", "a": "8 tentacules pinnulés, coloniaux, squelette souple ou corné, aucun urticant : gorgones, corail, plume de mer ; 5 ordres dont Alcyonides, Gorgonides, Pennatulidés"}, {"q": "Hexacoralliaires ?", "a": "Symétrie d'ordre 6, tentacules sans pinnules ; ordres : Actiniaires, Madréporaires, Cérianthaires, Antipathaires (corail noir), Zoanthaires"}, {"q": "Actiniaires et poisson-clown ?", "a": "Actiniaires : anémones sans squelette (ex. Actinia). Le poisson-clown (Amphiprion) vit en symbiose : protégé par les tentacules, il nettoie l'anémone"}, {"q": "Coraux hermatypiques vs ahermatypiques ?", "a": "Hermatypiques : bâtisseurs de récifs, avec zooxanthelles (dinoflagellés Symbiodinium). Ahermatypiques : peu ou pas bâtisseurs, sans zooxanthelles"}, {"q": "Conditions de vie des récifs coralliens ?", "a": "Entre 35° N et 32° S ; eaux chaudes (18-35 °C, optimum 26-28 °C) et pauvres en nutriments ; rarement au-delà de 70 m ; croissance ~1 cm/an"}, {"q": "Récifs coralliens : chiffres clés ?", "a": "~600 000 km² (0,17 % des océans) ; > 950 000 espèces associées ; ~30 % de la biomasse des océans ; 500 millions de personnes à moins de 100 km"}, {"q": "Cténaires ?", "a": "Diploblastiques, 8 rangées de palettes ciliées natatoires, colloblastes (cellules adhésives) ; marins, transparents, carnivores (Cestus veneris, Beroe ovata)"}, {"q": "Plathelminthes : caractères ?", "a": "Vers plats triploblastiques, acœlomates, symétrie bilatérale, tube digestif à une seule ouverture ; hermaphrodites ; 3 classes : Turbellariés, Trématodes, Cestodes"}, {"q": "Planaires (Turbellariés) ?", "a": "Libres, surtout marines (≤ 10 cm) ; fécondation croisée (parfois traumatique), cocon de ponte ; multiplication asexuée par division et grande capacité de régénération"}, {"q": "Trématodes digéniens ?", "a": "Parasites à au moins 2 hôtes : larve chez un mollusque, adulte chez un vertébré ; ex : douve du foie (Fasciola hepatica)"}, {"q": "Némathelminthes ?", "a": "Vers ronds triploblastiques acœlomates, cuticule épaisse, croissance par mues, sans appendices ni appareil circulatoire ou respiratoire ; gonochoriques (ex : oxyures)"}, {"q": "Némertes ?", "a": "Vers plats surtout marins et fouisseurs ; trompe vaginable ; tube digestif complet ; appareil circulatoire clos ; Lineus longissimus jusqu'à 30 m"}, {"q": "Rotifères ?", "a": "Plus petits métazoaires acœlomates (40-200 µm) ; organe rotateur cilié ; nombre de cellules fixe ; mâle nain sans tube digestif ; surtout d'eau douce"}]}};
const ORDER=["ocean","bio","flore"];
let deck="ocean",cards=[],i=0,flipped=false,known=0,seen=0,delArm=0;
const $=id=>document.getElementById(id);
try{const d=localStorage.getItem("rev-deck");if(d&&DECKS[d])deck=d}catch(e){}
function loadDeck(){
 cards=DECKS[deck].cards.map(c=>({q:c.q,a:c.a}));i=0;flipped=false;known=0;seen=0;
 try{const s=JSON.parse(localStorage.getItem(deck+"-cards")||"null");if(Array.isArray(s)&&s.length)cards=s;
 const sc=JSON.parse(localStorage.getItem(deck+"-score")||"null");if(sc){known=sc.k|0;seen=sc.s|0}}catch(e){}
}
function save(){try{localStorage.setItem(deck+"-cards",JSON.stringify(cards));localStorage.setItem(deck+"-score",JSON.stringify({k:known,s:seen}));localStorage.setItem("rev-deck",deck)}catch(e){}}
function render(){
 if(i>=cards.length)i=0;
 const hard=cards.filter(c=>(c.w||3)>3).length;
 $("meta").textContent=cards.length+" cartes  •  À revoir : "+hard+"  •  Score : "+known+"/"+seen;
 $("card").textContent=flipped?cards[i].a:cards[i].q;
 $("card").classList.toggle("back",flipped);
 $("hint").textContent=flipped?"Réponse":((cards[i].w||3)>3?"🔁 Carte à revoir • touche pour voir la réponse":"Touche la carte pour voir la réponse");
 $("answers").classList.toggle("hidden",!flipped);
}
function pick(){if(cards.length<2)return 0;const ws=cards.map((c,k)=>k===i?0:(c.w||3));let r=Math.random()*ws.reduce((x,y)=>x+y,0);for(let k=0;k<ws.length;k++){r-=ws[k];if(r<0)return k}return (i+1)%cards.length}
function next(ok){const c=cards[i];c.w=ok?Math.max(1,(c.w||3)-1):Math.min(10,(c.w||3)+2);if(ok)known++;seen++;flipped=false;i=pick();save();render()}
const sel=$("deck");
ORDER.forEach(id=>{const o=document.createElement("option");o.value=id;o.textContent=DECKS[id].name;sel.appendChild(o)});
sel.value=deck;
sel.onchange=()=>{save();deck=sel.value;loadDeck();save();render()};
$("card").onclick=()=>{flipped=!flipped;render()};
$("yes").onclick=()=>next(true);
$("no").onclick=()=>next(false);
$("add").onclick=()=>{$("addForm").classList.remove("hidden");$("q").focus()};
$("cancel").onclick=()=>$("addForm").classList.add("hidden");
$("addForm").onsubmit=e=>{e.preventDefault();const q=$("q").value.trim(),a=$("a").value.trim();
 if(q&&a){cards.push({q,a});i=cards.length-1;flipped=false;save();render()}
 $("q").value="";$("a").value="";$("addForm").classList.add("hidden")};
$("del").onclick=()=>{if(cards.length<=1)return;if(!delArm){delArm=1;$("del").textContent="Confirmer ?";setTimeout(()=>{delArm=0;$("del").textContent="Supprimer"},3000);return}delArm=0;$("del").textContent="Supprimer";cards.splice(i,1);flipped=false;save();render()};
$("reset").onclick=()=>{known=0;seen=0;cards.forEach(c=>c.w=3);save();render()};
loadDeck();render();
</script>
</body>
</html>
