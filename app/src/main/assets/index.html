<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Océanographie générale</title>
<style>
:root{--bg:#faf8ff;--fg:#1c1b22;--card:#fff;--muted:#6b6878;--accent:#5b4bdb;--ok:#2e9e5b;--bad:#d9534f;--line:#e2dff0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141b;--fg:#f0eefa;--card:#201f29;--muted:#a09db0;--accent:#8f82ff;--line:#33313f}}
:root[data-theme="dark"]{--bg:#15141b;--fg:#f0eefa;--card:#201f29;--muted:#a09db0;--accent:#8f82ff;--line:#33313f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{margin:0;text-align:center;font-size:26px;font-weight:600}
.meta{text-align:center;color:var(--muted);font-size:14px}
.card{flex:1;min-height:260px;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:24px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06);user-select:none}
.card.back{border-color:var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px}
button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;cursor:pointer}
button.ok{background:var(--ok);color:#fff;border:0}
button.bad{background:var(--bad);color:#fff;border:0}
button.main{background:var(--accent);color:#fff;border:0}
button.sm{font-size:13px;padding:10px}
.hidden{display:none}
form,.panel{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;width:100%}
</style>
</head>
<body>
<main>
  <h1>🌊 Océanographie</h1>
  <div class="meta" id="meta"></div>
  <div class="card" id="card"></div>
  <div class="hint" id="hint"></div>
  <div class="row hidden" id="answers">
    <button class="bad" id="no">À revoir</button>
    <button class="ok" id="yes">Je savais</button>
  </div>
  <form id="addForm" class="hidden">
    <input id="q" placeholder="Question" autocomplete="off">
    <input id="a" placeholder="Réponse" autocomplete="off">
    <div class="row"><button type="button" id="cancel">Annuler</button><button class="main" type="submit">Ajouter</button></div>
  </form>
  <div class="row">
    <button id="add">+ Ajouter</button>
    <button id="shuffle" class="sm">Mélanger</button>
    <button id="del" class="sm">Supprimer</button>
  </div>
  <button id="reset" class="sm">Tout remettre à zéro (score et difficulté)</button>
</main>
<script>
const DEFAULTS=[
 {q:"Qu'est-ce que l'océanographie ?",a:"Science qui étudie mers et océans : leurs limites et leurs interactions avec l'air, le fond, les continents et les organismes qui y vivent (pluridisciplinaire)"},
 {q:"Les 4 critères d'un océan ?",a:"Vaste superficie ; profondeur moyenne importante ; large communication avec les autres océans ; rivages appartenant à des continents différents"},
 {q:"Différence entre mer et océan ?",a:"Une mer ne possède pas les 4 critères à la fois"},
 {q:"Mers marginales : définition et exemples ?",a:"Sur les bords des océans, large communication, faibles profondeurs. Ex : mer du Nord, Manche, mer Jaune, mer d'Oman"},
 {q:"Méditerranées (type de mer) : définition et exemples ?",a:"Séparées de l'océan par un détroit formant un seuil, plus profondes. Ex : mer des Caraïbes, mer Rouge, Méditerranée"},
 {q:"Mers intérieures : définition et exemples ?",a:"Dans les terres, débouchent sur une autre mer par un détroit peu profond. Ex : mer Noire (Bosphore), Baltique"},
 {q:"Mers fermées : exemples ?",a:"Séparées complètement de l'océan : mer Caspienne, mer Morte, mer d'Aral"},
 {q:"Paramètres abiotiques du milieu marin ?",a:"Température, pH, salinité, transparence, turbidité, oxygène dissous, éléments nutritifs"},
 {q:"Définition de la salinité ?",a:"Masse (en g) de substances dissoutes dans 1 kg d'eau"},
 {q:"Comment mesure-t-on la transparence ?",a:"Disque de Secchi (disque blanc de 30 cm) descendu jusqu'à sa disparition"},
 {q:"Que sont les MES ?",a:"Matières en suspension : matériel particulaire (vivant ou détritique, minéral ou organique) entraîné passivement dans l'eau (mg/L)"},
 {q:"Les 2 grands domaines de classification des environnements ?",a:"Domaine pélagique (pleine eau) et domaine benthique (fond)"},
 {q:"Zones du relief du fond marin ?",a:"Plateau continental 0-200 m (néritique) ; talus 200-2000 m ; plaine abyssale 2000-6000 m (océanique) ; zone hadale > 6000 m"},
 {q:"Le système phytal : définition ?",a:"4 étages (supra-, médio-/eu-, infra-, circalittoral), végétaux benthiques chlorophylliens, correspond au plateau continental"},
 {q:"Étage médiolittoral (eulittoral) ?",a:"Zone de balancement des marées : alternance régulière d'émersion et d'immersion"},
 {q:"Étage infralittoral ?",a:"Région assez éclairée pour la vie des zostéracées et des algues photophiles"},
 {q:"Étage circalittoral ?",a:"S'étend jusqu'à la limite de vie des algues les moins exigeantes en lumière"},
 {q:"Les 3 étages du système aphytal ?",a:"Bathyal (talus, 200-2000 m), abyssal (2000-6000 m), hadal (> 6000 m)"},
 {q:"Les 5 zones du domaine pélagique ?",a:"Épipélagique (< 200 m) ; mésopélagique (200-1000 m) ; bathypélagique (1000-4000 m) ; abyssopélagique (4000 m-croûte) ; hadopélagique (failles, jusqu'à ~15 000 m)"},
 {q:"Les producteurs : rôle et exemples ?",a:"Autotrophes, base de la chaîne : macroalgues, phanérogames (posidonies), phytoplancton. Production primaire = photosynthèse"},
 {q:"Consommateurs C1 et C2 ?",a:"C1 : herbivores/phytophages (broutage), production secondaire. C2 : zoophages/carnivores (prédation), production tertiaire. Tous hétérotrophes"},
 {q:"Rôle des décomposeurs ?",a:"Transforment la matière organique des morts en matière minérale réutilisable : dernier maillon, cycle de la matière bouclé"},
 {q:"Loi de Lindeman (1942) ?",a:"Seulement ~10 % de l'énergie passe d'un maillon à l'autre (~90 % brûlés par les fonctions vitales)"},
 {q:"Réseau trophique ?",a:"Chaînes alimentaires qui convergent en un réseau dense et complexe ; les derniers maillons sont moins nombreux que les premiers"},
 {q:"Niveaux de la pyramide trophique (0 à 5) ?",a:"0 phytoplancton ; 1 zooplancton ; 2 prédateur I ; 3 prédateur II ; 4 prédateur III ; 5 super-prédateur"},
 {q:"Rôle des super-prédateurs ?",a:"Régulent les proies, limitent les pullulations, rôle sanitaire (éliminent faibles et malades)"},
 {q:"Les énergies marines citées dans le cours ?",a:"Biomasse algale, thermique, osmotique, marémotrice, éolienne, hydrolienne, houlomotrice"},
 {q:"Hydrolienne vs houlomotrice vs marémotrice ?",a:"Hydrolienne : courants de marée. Houlomotrice : vagues. Marémotrice : différence de niveau entre marée haute et basse (barrages)"},
 {q:"Bathymétrie ?",a:"Étude de la profondeur ; effets sur la lumière et la pression"},
 {q:"Pression : 1 bar et évolution avec la profondeur ?",a:"1 bar = 1 kg/cm² ; +1 bar tous les 10 m"},
 {q:"Formule de la pression absolue ?",a:"P absolue = P atmosphérique + P hydrostatique (2 bars à 10 m, 3 à 20 m, 4 à 30 m)"},
 {q:"Atténuation de la lumière : 2 phénomènes ?",a:"Absorption et diffusion. Infrarouges absorbés dans le 1er mètre ; au-delà de 1000 m, nuit noire"},
 {q:"Zone euphotique et profondeur de compensation ?",a:"Euphotique : photosynthèse à rendement positif (jusqu'à ~200 m). Compensation : respiration = photosynthèse"},
 {q:"Zone oligophotique ?",a:"Un peu de lumière mais trop faible pour une photosynthèse pérenne (200-500 m en Méditerranée)"},
 {q:"Photophiles vs sciaphiles ?",a:"Photophiles : aiment la lumière (algues, cnidaires à zooxanthelles). Sciaphiles : zones peu éclairées (corail rouge, Leptopsammia)"},
 {q:"Température en profondeur ?",a:"Homogène au-delà de 1000 m, ~4 °C (min ~2 °C vers 4000 m) ; 12 °C en Méditerranée (seuil de Gibraltar)"},
 {q:"Eurythermes, sténothermes, thermophiles ?",a:"Eurythermes : supportent de fortes variations. Sténothermes : très peu. Thermophiles : aiment les hautes températures"},
 {q:"Thermocline ?",a:"Brusque décroissance de température : 25-75 m en mers tropicales, 100-1000 m en mers tempérées"},
 {q:"Variations de la salinité en surface ?",a:"90 % entre 34 et 35 ‰ ; ~34 ‰ près de l'équateur (pluies), 36-37 ‰ sous les tropiques (évaporation)"},
 {q:"Solubilité de l'oxygène dans l'eau ?",a:"Diminue quand la salinité et la température augmentent (à 20 °C : 9 mg/L eau douce, 7,4 mg/L eau salée)"},
 {q:"Densité de l'eau de mer ?",a:"1,025 à 1,041 ; plus elle est salée et froide, plus elle est dense et plonge"},
 {q:"pH : définition et valeur en mer ?",a:"-log de l'activité des ions H⁺ ; 7 neutre ; eau de mer 7,5 à 8,5 (~8,2), stable grâce au pouvoir tampon (carbonates, borates)"},
 {q:"Province néritique vs océanique ?",a:"Néritique : plateau continental jusqu'à -200 m, peuplements riches. Océanique : au large, eaux assez pauvres"},
 {q:"Plancton, necton, neuston ?",a:"Plancton : entraîné passivement. Necton : nage indépendamment des courants. Neuston : flotte à la surface"},
 {q:"Benthos : sessile, sédentaire, vagile, fouisseur ?",a:"Sessile : fixé. Sédentaire : bouge peu. Vagile : se déplace. Fouisseur : enfoui dans le sédiment"},
 {q:"Holoplancton vs méroplancton ?",a:"Holoplancton : tout le cycle de vie dans le plancton. Méroplancton : une partie seulement (œufs, larves)"},
 {q:"Adaptations du plancton à la flottaison ?",a:"Plus de surface portante (soies, épines), petite taille, flotteurs de gaz, gouttelettes lipidiques, corps transparent"},
 {q:"Adaptations du necton ?",a:"Formes hydrodynamiques (fusiformes) ; dos sombre et ventre clair (homochromie)"},
 {q:"Poisson anadrome vs catadrome ?",a:"Anadrome : vit en mer, se reproduit en eau douce. Catadrome : vit en eau douce, se reproduit en mer"},
 {q:"Poisson diadrome, océanodrome, potamodrome ?",a:"Diadrome : alterne eau de mer et eau douce. Océanodrome : reste en mer. Potamodrome : reste en eau douce"},
 {q:"Classification dimensionnelle du benthos ?",a:"Microbenthos < 0,1 mm ; méiobenthos 0,1-2 mm ; macrobenthos > 2 mm"},
 {q:"Régimes trophiques du macrobenthos (5) ?",a:"Suspensivores, déposivores de surface, déposivores de sub-surface (limivores), brouteurs, carnivores macrophages (nécrophages)"},
 {q:"Cycle bentho-pélagique vs holobenthique ?",a:"Bentho-pélagique : phase larvaire planctonique puis adulte benthique (70 % des espèces). Holobenthique : pas de phase larvaire"},
 {q:"Abysses : définition ?",a:"Étendues d'eau de plus de 1000 m ; environ la moitié de la superficie des océans"},
 {q:"Adaptation des poissons abyssaux à la pression ?",a:"Perte de la vessie natatoire au profit d'organes liquides et gélatineux incompressibles (ne peuvent plus remonter)"},
 {q:"Réaction de la bioluminescence ?",a:"Luciférine + ATP + O₂ --(luciférase)--> oxyluciférine + photon + ADP"},
 {q:"Les 4 rôles de la bioluminescence ?",a:"Éclairage, attraction des proies, protection contre les prédateurs, communication"},
 {q:"Sources hydrothermales : caractéristiques ?",a:"Découvertes en 1977-78 (ride Est-Pacifique) ; fumeurs noirs jusqu'à 400 °C ; fluide acide, sans oxygène, riche en sulfures"},
 {q:"Base de la chaîne alimentaire hydrothermale ?",a:"Bactéries chimio-autotrophes (chimiolithotrophie, oxydation du H₂S, etc.)"},
 {q:"Les 3 apports de nourriture dans les abysses ?",a:"Pluie de particules (neige marine) ; déjections et carcasses ; « chaîne de poissons » mangeant ceux de l'étage supérieur"},
 {q:"Solutions à la solitude sexuelle dans les abysses ?",a:"Regroupement, hermaphrodisme (autofécondation), stockage du sperme (calamars : mâles 10 fois plus petits)"},
 {q:"Les 3 mouvements de l'eau (chapitre IV) ?",a:"Vagues (vent), courants (chaleur, rotation de la Terre, pesanteur), marées (Lune et Soleil)"},
 {q:"Cause des courants de surface ?",a:"Vents et force de Coriolis : sens horaire (hém. nord), anti-horaire (hém. sud). Couche d'Ekman : à droite du vent au nord"},
 {q:"Upwelling ?",a:"Le vent chasse l'eau chaude de surface au large, remplacée par de l'eau froide profonde riche en oxygène : zones poissonneuses"},
 {q:"Downwelling ?",a:"Convergence de courants de surface : les eaux s'enfoncent selon leur densité et apportent l'oxygène en profondeur"},
 {q:"Circulation thermohaline (tapis roulant) ?",a:"Due aux différences de température et de salinité ; plongée en Atlantique Nord ; environ 1000 ans pour un aller-retour"},
 {q:"El Niño : conséquences ?",a:"Alizés affaiblis ou renversés : réchauffement des eaux Pérou-Équateur, perte de l'upwelling (pêcheries), sécheresse Indonésie-Australie"},
 {q:"Situation normale du Pacifique (sans El Niño) ?",a:"Alizés vers l'ouest, empilement d'eau côté Australie-Indonésie (+50 cm), thermocline en pente, upwelling Pérou-Équateur"},
 {q:"Qu'est-ce qu'une vague et sa cause principale ?",a:"Onde mécanique à l'interface eau/air (crête, creux). Cause principale : le vent"},
 {q:"Tsunami : sens du mot et causes ?",a:"« Vague dans le port » (japonais). Déplacement brutal d'eau : séisme sous-marin (magnitude ≥ 7), éruption, glissement de terrain, météorite"},
 {q:"Tsunami près des côtes ?",a:"Période constante ; vitesse et longueur d'onde diminuent ; l'amplitude augmente (~40 km/h à 10 m de profondeur)"},
 {q:"Définition de la marée ?",a:"Mouvement régulier et périodique des eaux : montée (flux, flot) et descente (reflux, jusant), causé par la gravitation de la Lune et du Soleil"},
 {q:"Origine des deux renflements des marées ?",a:"Attraction gravitationnelle (côté de la Lune) + force centrifuge (côté opposé) : toujours deux renflements"},
 {q:"Marée semi-diurne ?",a:"2 pleines mers et 2 basses mers par jour ; 12 h 25 entre deux pleines mers ; décalage de ~50 min par jour"},
 {q:"Qu'est-ce que le marnage ?",a:"Différence de hauteur entre une pleine mer et la basse mer consécutive"},
 {q:"Vives-eaux vs mortes-eaux ?",a:"Vives-eaux : syzygies (nouvelle et pleine Lune), forces additionnées, grand marnage. Mortes-eaux : quadratures (quartiers), forces contrariées, faible marnage"},
 {q:"Marées d'équinoxe ?",a:"2 par an (mars et septembre) : plus fortes vives-eaux ; déclinaison du Soleil nulle aux équinoxes"},
 {q:"Revif et déchet ?",a:"Revif : marnage croissant (7-8 j) jusqu'aux vives-eaux. Déchet : marnage décroissant jusqu'aux mortes-eaux"},
 {q:"Les 4 types de marées ?",a:"Semi-diurne ; diurne ; semi-diurne à inégalité diurne ; mixte"},
 {q:"Règle des douzièmes ?",a:"Par heure de marée : 1/12, 2/12, 3/12, 3/12, 2/12, 1/12 du marnage (6 heures-marée)"},
 {q:"Durée du mois lunaire ?",a:"29 j 12 h 44 min (temps entre deux phases identiques de la Lune)"}
];
let cards=DEFAULTS.slice(),i=0,flipped=false,known=0,seen=0;
try{const s=JSON.parse(localStorage.getItem("ocean-cards")||"null");if(Array.isArray(s)&&s.length)cards=s;
const sc=JSON.parse(localStorage.getItem("ocean-score")||"null");if(sc){known=sc.k|0;seen=sc.s|0}}catch(e){}
function save(){try{localStorage.setItem("ocean-cards",JSON.stringify(cards));localStorage.setItem("ocean-score",JSON.stringify({k:known,s:seen}))}catch(e){}}
const $=id=>document.getElementById(id);
function render(){
 if(i>=cards.length)i=0;
 const hard=cards.filter(c=>(c.w||3)>3).length;
 $("meta").textContent=cards.length+" cartes  •  À revoir : "+hard+"  •  Score : "+known+"/"+seen;
 $("card").textContent=flipped?cards[i].a:cards[i].q;
 $("card").classList.toggle("back",flipped);
 $("hint").textContent=flipped?"Réponse":((cards[i].w||3)>3?"🔁 Carte à revoir • touche pour voir la réponse":"Touche la carte pour voir la réponse");
 $("answers").classList.toggle("hidden",!flipped);
}
function pick(){if(cards.length<2)return 0;const ws=cards.map((c,k)=>k===i?0:(c.w||3));let r=Math.random()*ws.reduce((x,y)=>x+y,0);for(let k=0;k<ws.length;k++){r-=ws[k];if(r<0)return k}return (i+1)%cards.length}
function next(ok){const c=cards[i];c.w=ok?Math.max(1,(c.w||3)-1):Math.min(10,(c.w||3)+2);if(ok)known++;seen++;flipped=false;i=pick();save();render()}
$("card").onclick=()=>{flipped=!flipped;render()};
$("yes").onclick=()=>next(true);
$("no").onclick=()=>next(false);
$("add").onclick=()=>{$("addForm").classList.remove("hidden");$("q").focus()};
$("cancel").onclick=()=>$("addForm").classList.add("hidden");
$("addForm").onsubmit=e=>{e.preventDefault();const q=$("q").value.trim(),a=$("a").value.trim();
 if(q&&a){cards.push({q,a});i=cards.length-1;flipped=false;save();render()}
 $("q").value="";$("a").value="";$("addForm").classList.add("hidden")};
$("shuffle").onclick=()=>{for(let k=cards.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[cards[k],cards[j]]=[cards[j],cards[k]]}
 i=0;flipped=false;save();render()};
let delArm=0;
$("del").onclick=()=>{if(cards.length<=1)return;if(!delArm){delArm=1;$("del").textContent="Confirmer ?";setTimeout(()=>{delArm=0;$("del").textContent="Supprimer"},3000);return}delArm=0;$("del").textContent="Supprimer";cards.splice(i,1);flipped=false;save();render()};
$("reset").onclick=()=>{known=0;seen=0;cards.forEach(c=>c.w=3);save();render()};
render();
</script>
</body>
</html>
